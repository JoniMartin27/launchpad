version: 2
updates:
  # Runtime + web dependencies. Grouped so a routine bump is one PR, not twelve.
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      dev-dependencies:
        dependency-type: development
      production-dependencies:
        dependency-type: production

  # The CI workflow pins action majors; without this they silently rot (the
  # Node 20 runner deprecation warning is exactly that).
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
